version: 2

models:
  - name: rides_silver
    description: "Cleaned and parsed ride events from the Bronze layer."

    columns:
      - name: ride_id
        data_tests:
          - not_null
          - unique

      - name: confirmation_number
        data_tests:
          - not_null

      - name: passenger_id
        data_tests:
          - not_null

      - name: driver_id
        data_tests:
          - not_null

      - name: vehicle_id
        data_tests:
          - not_null

      - name: event_timestamp
        data_tests:
          - not_null